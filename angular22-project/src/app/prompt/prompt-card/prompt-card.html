<p-card class="mb-3 w-30rem m-auto">
  <div class="flex justify-content-between align-items-center mb-2">
    <div>
      <h3 class="m-0">{{prompt().title}}</h3>
       <div class="text-sm text-color-secondary ">
         &#64;{{prompt().author.username}}
       </div>
    </div>
    <div class="flex gap-2">
      <p-button [routerLink]="['/prompts',prompt().id,'edit']" icon="pi pi-pencil" size="small" [text]="true" ></p-button>
      <p-button icon="pi pi-copy" (onClick)="copyToClipboard()" size="small" [text]="true" ></p-button></div>
    </div>

  <textarea pTextarea readonly style="width: 100%" rows = 8>
    {{prompt().content}}
  </textarea>
  <div class="flex justify-content-between align-items-center ">
      <p-tag severity="secondary"  [value]="prompt().category.name"></p-tag>
    <div class="flex gap-2 align-items-center">
      <p-button severity="secondary" icon="pi pi-thumbs-up" size="small"></p-button>
      <span>{{prompt().score}}</span>
      <p-button severity="secondary" icon="pi pi-thumbs-down" size="small"></p-button>
    </div>
  </div>

</p-card>
