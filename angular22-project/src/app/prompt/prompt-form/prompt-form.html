<p-card>
  <form [formGroup]="form" (ngSubmit)="submitForm()">
    <div class="field">
      <label for="title">Title</label>
      <input  formControlName="title" id="title" pInputText type="text" class="w-full">
    </div>
    <div class="field">
      <label for="content">Content</label>
      <textarea formControlName="content" id="content" pTextarea type="text" class="w-full"></textarea>
    </div>
    <div class="field">
      <label for="category">Title</label>
      <p-select inputId="category"
                formControlName="categoryId"
                class="w-full"
                optionValue="id"
                optionLabel="name"
                [options]="category()">
      </p-select>
    </div>
    <div class="flex justify-content-end  gap-2">
      <p-button label="Anuller" routerLink="/prompts" severity="secondary"></p-button>
      <p-button type="submit" label="Créer"></p-button>
    </div>
  </form>
</p-card>
