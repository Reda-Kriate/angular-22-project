<p-card>
  <form [formGroup]="form" (ngSubmit)="submitForm()">
    <div class="field">
      <label for="title">Titre</label>
      <input  formControlName="title" id="title" pInputText type="text" class="w-full">
      <small class="invalid-feedback">Le titre est requis (Max 30 carac.)</small>
    </div>
    <div class="field">
      <label for="content">Contenu</label>
      <textarea formControlName="content" id="content" pTextarea type="text" class="w-full"></textarea>
      <small class="invalid-feedback">Le contenu est requis</small>

    </div>
    <div class="field">
      <label for="category">Catégorie</label>
      <p-select inputId="category"
                formControlName="categoryId"
                class="w-full"
                optionValue="id"
                optionLabel="name"
                [options]="category()">
      </p-select>
      <small class="invalid-feedback">La catégorie est requise</small>
    </div>
      <div class="flex justify-content-end  gap-2">
        @if (promptId()) {
          <p-button
            class="mr-auto"
            label="Supprimer"
            severity="danger"
            (onClick)="deletePrompt()"
            [outlined]="true"></p-button>
        }
        <p-button label="Anuller" routerLink="/prompts" severity="secondary"></p-button>
        <p-button type="submit" [label]="promptId()? 'Modifier' : 'Créer' "></p-button>
      </div>
  </form>
</p-card>
