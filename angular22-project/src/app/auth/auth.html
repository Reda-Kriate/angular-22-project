<p-card [header]="mode() === 'login' ? 'Connexion' : 'Créer un compte'">
  <form [formGroup]= "form" (ngSubmit)="submit()">
    <div>
      <label for="username">Nom d'utilisateur</label>
      <input formControlName="username" class="w-full mt-2" pInputText id="username">
    </div>
    <div class="mt-3">
      <label for="password">Mot de passe</label>
      <p-password formControlName="password" inputStyleClass="w-full" class="w-full mt-2" type ="password" id="password"></p-password>
    </div>
    <div class="flex justify-content-end gap-2 mt-3">
      <p-button (onClick)="toggleMode()" [label]="mode() === 'login' ? 'Créer un compte' : 'Se connecter' " ></p-button>
      <p-button type="submit" [label]="mode() === 'login' ? 'Connexion' : 'Créer le compte'"></p-button>
    </div>
  </form>
</p-card>
